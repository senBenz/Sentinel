<svg width="100%" viewBox="0 0 680 820" xmlns="http://www.w3.org/2000/svg">
<title>Sentinel - Alert State Machine Diagram</title>
<desc>5-level state machine showing escalation from normal monitoring to emergency stop, with score thresholds, time delays, de-escalation paths, cooldown, and emergency override.</desc>

<style>
  text { font-family: Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; fill: #555; }
  .box-green { fill: #EAF3DE; stroke: #639922; }
  .box-amber { fill: #FAEEDA; stroke: #BA7517; }
  .box-coral { fill: #FAECE7; stroke: #993C1D; }
  .box-red { fill: #FCEBEB; stroke: #A32D2D; }
  .box-teal { fill: #E1F5EE; stroke: #0F6E56; }
  .text-green { fill: #27500A; }
  .text-amber { fill: #633806; }
  .text-coral { fill: #712B13; }
  .text-red { fill: #791F1F; }
  .text-teal { fill: #085041; }
  .sub-green { fill: #3B6D11; }
  .sub-amber { fill: #854F0B; }
  .sub-coral { fill: #993C1D; }
  .sub-red { fill: #A32D2D; }
  .sub-teal { fill: #0F6E56; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Level 0 : Normal -->
<rect class="box-green" x="220" y="40" width="240" height="56" rx="8" stroke-width="0.5"/>
<text class="th text-green" x="340" y="62" text-anchor="middle" dominant-baseline="central">Niveau 0 : normal</text>
<text class="ts sub-green" x="340" y="80" text-anchor="middle" dominant-baseline="central">Monitoring passif</text>

<!-- Score label 0->1 -->
<text class="ts" x="345" y="118" text-anchor="start">Score ≥ 30 pendant 2s</text>

<!-- Arrow 0 -> 1 -->
<line x1="340" y1="96" x2="340" y2="136" stroke="#555" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Level 1 : Somnolent -->
<rect class="box-amber" x="220" y="140" width="240" height="56" rx="8" stroke-width="0.5"/>
<text class="th text-amber" x="340" y="158" text-anchor="middle" dominant-baseline="central">Niveau 1 : somnolent</text>
<text class="ts sub-amber" x="340" y="178" text-anchor="middle" dominant-baseline="central">Bip toutes les 3s</text>

<!-- Score label 1->2 -->
<text class="ts" x="345" y="218" text-anchor="start">Score ≥ 55 pendant 3s</text>

<!-- Arrow 1 -> 2 -->
<line x1="340" y1="196" x2="340" y2="236" stroke="#555" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Level 2 : Dangereux -->
<rect class="box-coral" x="220" y="240" width="240" height="56" rx="8" stroke-width="0.5"/>
<text class="th text-coral" x="340" y="258" text-anchor="middle" dominant-baseline="central">Niveau 2 : dangereux</text>
<text class="ts sub-coral" x="340" y="278" text-anchor="middle" dominant-baseline="central">Alarme + vibration</text>

<!-- Score label 2->3 -->
<text class="ts" x="345" y="318" text-anchor="start">Score ≥ 75 pendant 3s</text>

<!-- Arrow 2 -> 3 -->
<line x1="340" y1="296" x2="340" y2="336" stroke="#555" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Level 3 : Critique -->
<rect class="box-red" x="220" y="340" width="240" height="56" rx="8" stroke-width="0.5"/>
<text class="th text-red" x="340" y="358" text-anchor="middle" dominant-baseline="central">Niveau 3 : critique</text>
<text class="ts sub-red" x="340" y="378" text-anchor="middle" dominant-baseline="central">Message vocal + countdown</text>

<!-- Score label 3->4 -->
<text class="ts" x="345" y="418" text-anchor="start">Score ≥ 90 pendant 5s</text>

<!-- Arrow 3 -> 4 -->
<line x1="340" y1="396" x2="340" y2="436" stroke="#555" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Level 4 : Arret d'urgence -->
<rect class="box-red" x="220" y="440" width="240" height="56" rx="8" stroke-width="1"/>
<text class="th text-red" x="340" y="458" text-anchor="middle" dominant-baseline="central">Niveau 4 : non-reactif</text>
<text class="ts sub-red" x="340" y="478" text-anchor="middle" dominant-baseline="central">Arret d'urgence</text>

<!-- No return from level 4 -->
<text class="ts" x="340" y="516" text-anchor="middle" fill="#A32D2D" font-weight="600">Pas de retour automatique</text>

<!-- DE-ESCALATION arrows (left side, green dashed) -->

<!-- 1 -> 0 -->
<path d="M220 168 L140 168 L140 68 L218 68" fill="none" stroke="#1D9E75" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="72" y="100" text-anchor="start" fill="#0F6E56">Score &lt; 30</text>
<text class="ts" x="72" y="114" text-anchor="start" fill="#0F6E56">pendant 10s</text>

<!-- 2 -> 1 -->
<path d="M220 268 L120 268 L120 168 L218 168" fill="none" stroke="#1D9E75" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="52" y="210" text-anchor="start" fill="#0F6E56">Score &lt; 55</text>
<text class="ts" x="52" y="224" text-anchor="start" fill="#0F6E56">pendant 5s</text>

<!-- 3 -> 2 -->
<path d="M220 368 L100 368 L100 268 L218 268" fill="none" stroke="#1D9E75" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="42" y="310" text-anchor="start" fill="#0F6E56">Score &lt; 75</text>
<text class="ts" x="42" y="324" text-anchor="start" fill="#0F6E56">pendant 5s</text>

<!-- EMERGENCY OVERRIDE (right side) -->
<rect class="box-red" x="500" y="258" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th text-red" x="575" y="276" text-anchor="middle" dominant-baseline="central">Urgence</text>
<text class="ts sub-red" x="575" y="296" text-anchor="middle" dominant-baseline="central">PERCLOS > 0.50</text>

<!-- Emergency -> Level 3 -->
<path d="M575 314 L575 368 L462 368" fill="none" stroke="#E24B4A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="510" y="346" text-anchor="start" fill="#A32D2D">Saut direct</text>

<rect class="box-red" x="500" y="172" width="150" height="44" rx="8" stroke-width="0.5"/>
<text class="th text-red" x="575" y="194" text-anchor="middle" dominant-baseline="central">Pitch > 40°</text>

<!-- Pitch emergency -> urgence box -->
<path d="M575 216 L575 254" fill="none" stroke="#E24B4A" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- COOLDOWN SECTION -->
<rect class="box-teal" x="140" y="570" width="400" height="80" rx="12" stroke-width="0.5"/>
<text class="th text-teal" x="340" y="598" text-anchor="middle" dominant-baseline="central">Cooldown (5 min apres retour au niveau 0)</text>
<text class="ts sub-teal" x="340" y="622" text-anchor="middle" dominant-baseline="central">Seuils abaisses de 10% : [0, 27, 49, 67, 81]</text>

<!-- Arrow from Level 0 to Cooldown -->
<path d="M260 96 L60 96 L60 610 L138 610" fill="none" stroke="#1D9E75" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="64" y="450" text-anchor="start" fill="#0F6E56">Retour</text>
<text class="ts" x="64" y="464" text-anchor="start" fill="#0F6E56">au nv.0</text>

<!-- LEGEND -->
<text class="th" x="140" y="700" text-anchor="start" fill="#333">Legende</text>

<line x1="140" y1="720" x2="200" y2="720" stroke="#555" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="210" y="724" text-anchor="start">Escalade (score monte)</text>

<line x1="140" y1="745" x2="200" y2="745" stroke="#1D9E75" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="210" y="749" text-anchor="start">Desescalade (score descend)</text>

<line x1="140" y1="770" x2="200" y2="770" stroke="#E24B4A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="210" y="774" text-anchor="start">Escalade d'urgence (bypass le score)</text>

</svg>
